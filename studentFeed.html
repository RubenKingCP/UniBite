
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniBite</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 🔝 TOP NAVBAR -->
  <header class="navbar">
    <div class="logo">🍽 UniBite</div>

    <nav class="nav-links">
      <a href="studentFeed.html">Feed</a>
      <a href="create-post.html">Create</a>
      <a href="dashboard.html">Dashboard</a>
      
    </nav>

    <div class="user-actions">
      <span id="userPoints">⭐ 5</span>
      <button id="logoutBtn">Logout</button>
    </div>
  </header>

  <!-- 📱 MAIN LAYOUT -->
  <main class="app-layout">

    <!-- 🔍 SIDEBAR -->
    <aside class="sidebar">

      <h3>Filters</h3>

      <input type="text" id="searchInput" placeholder="Search meals...">

      <label>Sort by:</label>
      <select id="sortSelect">
        <option value="newest">Newest</option>
        <option value="distance">Distance</option>
      </select>

      <label>Allergens:</label>
      <div class="checkbox-group">
        <label><input type="checkbox" value="gluten"> Gluten</label>
        <label><input type="checkbox" value="milk"> Milk</label>
        <label><input type="checkbox" value="nuts"> Nuts</label>
      </div>

    </aside>

    <!-- 🍝 FEED CONTENT -->
    <section class="feed">

      <div class="feed-header">
        <h2>Available Meals</h2>
      </div>

      <!-- POSTS CONTAINER (JS FILLS THIS) -->
      <div id="postsContainer" class="posts-grid">

        <!-- Example Card (JS will generate these) -->
        <div class="post-card">
          <div class="post-header">
            <h3>Spaghetti Bolognese</h3>
            <span class="status available">Available</span>
          </div>

          <p class="description">
            Homemade pasta with rich tomato sauce 🍝
          </p>

          <div class="post-info">
            <span>🍽 3 portions</span>
            <span>📍 Dorm A</span>
            <span>⏰ 18:00</span>
          </div>

          <div class="allergens">
            <span>Gluten</span>
          </div>

          <div class="post-actions">
            <button class="request-btn">Request</button>
          </div>
        </div>

      </div>

    </section>

  </main>

</body>
</html>
